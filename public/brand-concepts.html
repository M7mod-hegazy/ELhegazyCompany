<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>الحجازي — Logo Concepts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400..700&family=Fraunces:opsz,wght@9..144,300..600&family=Inter:wght@300..600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink-900: #0a0a0b; --ink-800: #141416; --ink-700: #1e1e22;
        --brass: #c9a86a; --brass-hi: #e8d6a8; --brass-deep: #9a7c45;
        --oxblood: #5a1f1b; --bone: #ede7da; --bone-muted: #a39c8e;
        --kufi: "Reem Kufi", sans-serif; --serif: "Fraunces", serif; --sans: "Inter", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; overflow: hidden; }
      body {
        background: var(--ink-900); color: var(--bone); font-family: var(--sans);
        padding: 2.2vh 2.4vw; display: flex; flex-direction: column;
        -webkit-font-smoothing: antialiased;
      }
      .head {
        display: flex; justify-content: space-between; align-items: baseline;
        border-bottom: 1px solid rgba(201,168,106,0.22);
        padding-bottom: 1.4vh; margin-bottom: 1.8vh; flex: 0 0 auto;
      }
      .head h1 { font-family: var(--kufi); font-size: clamp(16px, 2.4vh, 26px); font-weight: 600; color: var(--brass); }
      .head .meta { font-size: clamp(8px, 1.2vh, 11px); letter-spacing: 0.3em; text-transform: uppercase; color: var(--bone-muted); }
      .grid { flex: 1 1 auto; display: grid; grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 1fr); gap: 1.6vh 1.6vw; min-height: 0; }
      .card {
        position: relative; background: linear-gradient(160deg, var(--ink-800), var(--ink-900));
        border: 1px solid rgba(201,168,106,0.14); border-radius: 14px;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 2vh; overflow: hidden; min-height: 0;
      }
      .card .num { position: absolute; top: 1.2vh; inset-inline-start: 1vw; font-size: clamp(9px,1.2vh,11px); letter-spacing: 0.2em; color: var(--bone-muted); }
      .card .label { position: absolute; bottom: 1.2vh; inset-inline-end: 1vw; font-size: clamp(8px,1.1vh,10px); letter-spacing: 0.26em; text-transform: uppercase; color: var(--bone-muted); }
      .spot { position: absolute; inset: 0; background: radial-gradient(50% 45% at 50% 42%, rgba(201,168,106,0.10), transparent 70%); }
      .mark { position: relative; z-index: 1; display:flex; flex-direction:column; align-items:center; gap: 1.8vh; }
      .haa { font-family: var(--kufi); line-height: 1; }

      .seal { width: 13vh; height: 13vh; border-radius: 50%; border: 1.5px solid var(--brass); display: flex; align-items: center; justify-content: center; position: relative; }
      .seal::after { content: ""; position: absolute; inset: 0.9vh; border-radius: 50%; border: 1px solid rgba(201,168,106,0.35); }
      .seal .haa { font-size: 7.6vh; color: var(--brass); font-weight: 600; }

      .tile-outline { width: 13vh; height: 13vh; border-radius: 3vh; border: 1.5px solid var(--brass); display: flex; align-items: center; justify-content: center; }
      .tile-outline .haa { font-size: 8.2vh; color: var(--brass); font-weight: 500; }

      .tile-solid { width: 13vh; height: 13vh; border-radius: 3vh; background: linear-gradient(150deg, var(--brass-hi), var(--brass) 55%, var(--brass-deep)); display: flex; align-items: center; justify-content: center; box-shadow: 0 1.8vh 4vh -1.8vh rgba(201,168,106,0.5); }
      .tile-solid .haa { font-size: 8.4vh; color: var(--ink-900); font-weight: 600; }

      .typo { display: flex; align-items: center; gap: 2.2vh; }
      .typo .haa { font-size: 9.6vh; color: var(--brass); font-weight: 600; }
      .typo .rule { width: 1px; height: 8.6vh; background: rgba(201,168,106,0.5); }
      .typo .stack { text-align: start; }
      .typo .stack .ar { font-family: var(--kufi); font-size: 3vh; color: var(--bone); font-weight: 600; }
      .typo .stack .en { font-family: var(--sans); font-size: clamp(9px,1.2vh,11px); letter-spacing: 0.34em; text-transform: uppercase; color: var(--bone-muted); margin-top: 0.6vh; }

      .wordmark { font-family: var(--kufi); font-size: clamp(16px, 2.4vh, 24px); color: var(--bone); font-weight: 500; }
      .wordmark .em { color: var(--brass); }

      .footer { flex: 0 0 auto; margin-top: 1.8vh; display: flex; align-items: center; justify-content: center; gap: 1.4vw; }
      .footer .seal2 { width: 7vh; height: 7vh; border-radius: 50%; border: 1.5px solid var(--brass); display:flex; align-items:center; justify-content:center; }
      .footer .seal2 .haa { font-size: 4vh; color: var(--brass); font-weight: 600; }
      .footer .names { text-align: start; }
      .footer .names .ar { font-family: var(--kufi); font-size: clamp(20px,3.4vh,38px); color: var(--bone); font-weight: 600; }
      .footer .names .ar .em { color: var(--brass); }
      .footer .names .en { font-family: var(--serif); font-size: clamp(10px,1.4vh,14px); letter-spacing: 0.3em; text-transform: uppercase; color: var(--bone-muted); margin-top: 0.4vh; }
    </style>
  </head>
  <body>
    <div class="head">
      <h1>الحجازي · نظام الهوية</h1>
      <div class="meta">ELHEGAZI — LOGO CONCEPTS · BRASS ON INK</div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="spot"></div><span class="num">02</span>
        <div class="mark"><div class="tile-outline"><span class="haa">ح</span></div><div class="wordmark">شركة <span class="em">الحجازي</span></div></div>
        <span class="label">Outline Tile</span>
      </div>
      <div class="card">
        <div class="spot"></div><span class="num">01</span>
        <div class="mark"><div class="seal"><span class="haa">ح</span></div><div class="wordmark">شركة <span class="em">الحجازي</span></div></div>
        <span class="label">Atelier Seal</span>
      </div>
      <div class="card">
        <div class="spot"></div><span class="num">04</span>
        <div class="mark"><div class="typo"><span class="haa">ح</span><span class="rule"></span><span class="stack"><span class="ar">الحجازي</span><span class="en">ELHEGAZI</span></span></div></div>
        <span class="label">Typographic Lockup</span>
      </div>
      <div class="card">
        <div class="spot"></div><span class="num">03</span>
        <div class="mark"><div class="tile-solid"><span class="haa">ح</span></div><div class="wordmark">شركة <span class="em">الحجازي</span></div></div>
        <span class="label">Solid Knockout · App Icon</span>
      </div>
    </div>

    <div class="footer">
      <div class="seal2"><span class="haa">ح</span></div>
      <div class="names">
        <div class="ar">شركة <span class="em">الحجازي</span></div>
        <div class="en">Creative &amp; Digital Agency</div>
      </div>
    </div>
  </body>
</html>
